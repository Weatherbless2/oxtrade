<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>oxApp 生产交付路线图</title>
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --rule:rgba(45,49,66,.12); --accent:#eb6c36; --accent-tint:rgba(235,108,54,.08); }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:Geist,"Noto Sans SC","Microsoft YaHei",sans-serif; }
    main { max-width:1280px; margin:0 auto; padding:32px 32px 24px; }
    .eyebrow { margin:0 0 8px; color:var(--soft); font:500 12px/1.2 "Geist Mono","Noto Sans Mono CJK SC",monospace; letter-spacing:.08em; }
    h1 { margin:0; font:400 36px/1.1 Georgia,"Noto Serif SC",serif; letter-spacing:0; }
    .subtitle { max-width:900px; margin:12px 0 24px; color:var(--muted); font-size:16px; line-height:1.6; }
    figure { margin:0; }
    svg { width:100%; height:auto; display:block; }
    figcaption { margin-top:12px; color:var(--muted); font-size:14px; line-height:1.6; }
    .footer { margin-top:20px; padding-top:16px; border-top:1px solid var(--rule); color:var(--soft); font:12px/1.5 "Geist Mono","Noto Sans Mono CJK SC",monospace; }
  </style>
</head>
<body>
<main>
  <p class="eyebrow">OXAPP / OXMBS / QMT · 工单推进</p>
  <h1>从“查到一条真实数据”到“能稳定上线”</h1>
  <p class="subtitle">路线不按页面好不好看来排，而是先把身份、业务边界和数据容量打牢，再扩展到全量浏览、实时推送、稳定性和发布。每一阶段完成后才进入下一阶段。</p>
  <figure>
    <svg viewBox="0 0 1280 720" role="img" aria-labelledby="oxapp-production-delivery-roadmap-title oxapp-production-delivery-roadmap-desc">

      </defs>

      <rect width="1280" height="720" fill="#f5f5f5"/>
      <line x1="80" y1="304" x2="1200" y2="304" stroke="#bfc0c0" stroke-width="2"/>
      <line x1="248" y1="304" x2="280" y2="304" stroke="#eb6c36" stroke-width="2" marker-end="url(#roadmap-arrow-accent)"/>
      <line x1="488" y1="304" x2="520" y2="304" stroke="#4f5d75" stroke-width="2" marker-end="url(#roadmap-arrow)"/>
      <line x1="728" y1="304" x2="760" y2="304" stroke="#4f5d75" stroke-width="2" marker-end="url(#roadmap-arrow)"/>
      <line x1="968" y1="304" x2="1000" y2="304" stroke="#4f5d75" stroke-width="2" marker-end="url(#roadmap-arrow)"/>

      <g>
        <rect x="48" y="176" width="200" height="256" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="2"/>
        <rect x="64" y="192" width="32" height="24" rx="4" fill="#eb6c36"/>
        <text x="80" y="210" text-anchor="middle" fill="#ffffff" font-size="12" font-family="Geist Mono, 'Noto Sans Mono CJK SC', monospace">01</text>
        <text x="64" y="248" fill="#2d3142" font-size="20" font-weight="600" font-family="Geist, 'Noto Sans SC', sans-serif">真实认证</text>

      <g>

        <text x="320" y="210" text-anchor="middle" fill="#4f5d75" font-size="12" font-family="Geist Mono, 'Noto Sans Mono CJK SC', monospace">02</text>
        <text x="304" y="248" fill="#2d3142" font-size="20" font-weight="600" font-family="Geist, 'Noto Sans SC', sans-serif">后台业务边界</text>
        <text x="304" y="276" fill="#4f5d75" font-size="12" font-family="Geist, 'Noto Sans SC', sans-serif">OX-P0-09 ~ 11</text>
        <line x1="304" y1="296" x2="472" y2="296" stroke="rgba(45,49,66,.12)"/>

        <text x="304" y="356" fill="#2d3142" font-size="14" font-family="Geist, 'Noto Sans SC', sans-serif">容量、分页、lbm_qmt</text>
        <text x="304" y="400" fill="#7a8399" font-size="12" font-family="Geist, 'Noto Sans SC', sans-serif">系统获得：</text>
        <text x="304" y="420" fill="#7a8399" font-size="12" font-family="Geist, 'Noto Sans SC', sans-serif">可扩展的正式查询边界</text>
      </g>

      <g>
        <rect x="528" y="176" width="200" height="256" rx="6" fill="#ffffff" stroke="#2d3142"/>

        <text x="544" y="356" fill="#2d3142" font-size="14" font-family="Geist, 'Noto Sans SC', sans-serif">服务端分页与新鲜度</text>
        <text x="544" y="400" fill="#7a8399" font-size="12" font-family="Geist, 'Noto Sans SC', sans-serif">用户第一次能看到：</text>
        <text x="544" y="420" fill="#7a8399" font-size="12" font-family="Geist, 'Noto Sans SC', sans-serif">多页真实股票和期货</text>

        <text x="784" y="248" fill="#2d3142" font-size="20" font-weight="600" font-family="Geist, 'Noto Sans SC', sans-serif">实时与稳定性</text>

      <g>

        <text x="1024" y="248" fill="#2d3142" font-size="20" font-weight="600" font-family="Geist, 'Noto Sans SC', sans-serif">运行与发布</text>
        <text x="1024" y="276" fill="#4f5d75" font-size="12" font-family="Geist, 'Noto Sans SC', sans-serif">OX-P1-03 ~ 05</text>
        <line x1="1024" y1="296" x2="1192" y2="296" stroke="rgba(45,49,66,.12)"/>
        <text x="1024" y="328" fill="#2d3142" font-size="14" font-family="Geist, 'Noto Sans SC', sans-serif">监控、告警、故障注入</text>
        <text x="1024" y="356" fill="#2d3142" font-size="14" font-family="Geist, 'Noto Sans SC', sans-serif">部署、迁移与回滚</text>
        <text x="1024" y="400" fill="#7a8399" font-size="12" font-family="Geist, 'Noto Sans SC', sans-serif">系统具备：</text>
        <text x="1024" y="420" fill="#7a8399" font-size="12" font-family="Geist, 'Noto Sans SC', sans-serif">可运行、可定位、可恢复</text>

      <rect x="208" y="512" width="864" height="72" rx="6" fill="rgba(45,49,66,.03)" stroke="rgba(45,49,66,.20)" stroke-dasharray="4 4"/>
      <text x="240" y="544" fill="#4f5d75" font-size="12" font-family="Geist Mono, 'Noto Sans Mono CJK SC', monospace" letter-spacing="1">每阶段的交付闸门</text>
      <text x="240" y="568" fill="#2d3142" font-size="16" font-family="Geist, 'Noto Sans SC', sans-serif">代码和中文注释 → 构建/验证记录 → 简洁阶段说明 → 本地 Git 提交 → 才能开始下一阶段</text>

      <text x="48" y="668" fill="#4f5d75" font-size="12" font-family="Geist Mono, 'Noto Sans Mono CJK SC', monospace">强调点</text>
      <rect x="144" y="652" width="20" height="20" rx="4" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/>
      <text x="180" y="668" fill="#4f5d75" font-size="12" font-family="Geist, 'Noto Sans SC', sans-serif">先鉴权，才能让真实数据页面和实时订阅具备可信边界</text>

    <figcaption>图中把十张开发工单收敛为五个用户能理解的阶段。具体分支、依赖、文件边界和验收标准以 `OX-production-roadmap.md` 的工单总表为准。</figcaption>

  <p class="footer">格式：HTML · 尺寸：文档宽度 1280×720 · 细节：平衡 · 读者：产品、开发与评审人员</p>
